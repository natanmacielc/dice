name: Deploy dev

# Roda depois do CI verde na main (ou manualmente). Único caminho de deploy: nunca rode cdk deploy local.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: CDK deploy + smoke test
    # workflow_run com branches: [main] também casa com PR de fork cuja branch se chame main.
    # Só um push na main deste repositório (ou disparo manual) pode chegar às credenciais.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      PUBLIC_URL: https://dice.nimbos.solutions
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      # E-mail dos alertas (SNS do kill switch e AWS Budgets). Opcional; fica fora do repositório.
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Os testes deste commit já passaram no CI; aqui só empacota o function.zip.
      - run: ./mvnw -B -ntp -pl dice-core,dice-app -am package -DskipTests
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: dice-deploy-${{ github.run_id }}
          aws-region: sa-east-1
      - name: cdk deploy
        working-directory: infra
        run: npx --yes aws-cdk@2.1143.0 deploy DiceCertStack DiceDevStack DicePlanStack --require-approval never --no-notices --outputs-file cdk-outputs.json -c hostedZoneId="$HOSTED_ZONE_ID" -c alertEmail="$ALERT_EMAIL"
      - name: Smoke test
        run: |
          python -m pip install -r tools/smoke/requirements.txt
          function_url="$(python3 -c "import json; print(json.load(open('infra/cdk-outputs.json'))['DiceDevStack']['FunctionUrl'])")"
          tools/smoke/smoke-dev.sh "$PUBLIC_URL" "$function_url"
