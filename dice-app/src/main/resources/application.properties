# drand quicknet. O chain hash é fixo no código (DrandQuicknet), não é configurável.
drand.endpoints=https://api.drand.sh,https://api2.drand.sh,https://api3.drand.sh,https://drand.cloudflare.com
drand.connect-timeout=2s
drand.read-timeout=3s

# DynamoDB. A tabela é criada pelo CDK (Fase 5). endpoint-override só para DynamoDB Local.
dice.dynamodb.table=dice

# Imagens Open Graph (og/{rollId}.png). O bucket é criado pelo CDK (Fase 5).
dice.s3.bucket=dice-og
# Base pública para URLs absolutas do Open Graph. Produção define via ambiente (Fase 5).
dice.public-base-url=http://localhost:8080

# Cabeçalhos de segurança em todas as respostas. O navegador só fala com este site e com o drand.
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.drand.sh https://api2.drand.sh https://api3.drand.sh https://drand.cloudflare.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
